[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "thorpy"
dynamic = ["version"]
license = "MIT"
license-files = []
description = "GUI library for pygame"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Yann Thorimbert", email = "yann.thorimbert@gmail.com" },
]

keywords = [
    "pygame",
    "gui",
    "menus",
    "buttons",
    "widgets",
    "user interface",
    "toolkit",
]

dependencies = [
    "pygame",
    "numpy",
    "Pillow",
]


[project.urls]
Homepage = "https://www.thorpy.org/"
Repository = "https://github.com/YannThorimbert/Thorpy2"
Issues = "https://github.com/YannThorimbert/Thorpy2/issues"

[tool.setuptools.dynamic]
version = { attr = "thorpy.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["thorpy*"]

[tool.setuptools.package-data]
thorpy = [
    "data/*",
    "py.typed",
]